name: Online HRD app checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/online-cloud-persistence]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hrd_online_test
          POSTGRES_USER: hrd_test
          POSTGRES_PASSWORD: hrd_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrd_test -d hrd_online_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hrd_test:hrd_test_password@localhost:5432/hrd_online_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply online database schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/postgres/001_online_schema.sql
      - name: Compile application
        run: python -m compileall -q app.py
      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify PostgreSQL schema
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) = 9 AS expected_tables FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';" | grep -q t
