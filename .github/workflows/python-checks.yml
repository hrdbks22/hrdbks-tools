name: HRD Tools checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hybrid-cloud-lan]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hrd_tools_test
          POSTGRES_USER: hrd_test
          POSTGRES_PASSWORD: hrd_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrd_test -d hrd_tools_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hrd_test:hrd_test_password@localhost:5432/hrd_tools_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: |
          for migration in migrations/postgres/001_sync_foundation.sql migrations/postgres/002_sync_runtime.sql migrations/postgres/003_sync_runtime_compat.sql migrations/postgres/004_hrd_business_schema.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Compile Python modules
        run: python -m compileall -q app.py sync deploy tests
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
