services:
  hrd-db:
    image: postgres:16-alpine
    container_name: hrd-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrd_tools}
      POSTGRES_USER: ${POSTGRES_USER:-hrd_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - hrd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrd_admin} -d ${POSTGRES_DB:-hrd_tools}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hrd_postgres_data:
